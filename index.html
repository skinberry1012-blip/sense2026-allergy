<script>
/* 11/12: 이 기기에 예전 화면 파일이 저장돼 있으면(버전이 다르면) 저장본을 지우고 한 번만 새로 열어요 */
window.APP_V = 'v197-sign-right';
window.addEventListener('load', function () {
  if (window.JS_V === window.APP_V) return;
  try { if (sessionStorage.getItem('appVfix') === window.APP_V) return; sessionStorage.setItem('appVfix', window.APP_V); } catch (e) { return; }
  var jobs = [];
  if (window.caches) jobs.push(caches.keys().then(function (k) { return Promise.all(k.map(function (x) { return caches.delete(x); })); }));
  if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.update().catch(function () {}); })); }));
  Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
});
</script>

  <div id="stage"><main id="app" class="screen"></main><div id="layer"></div></div>
